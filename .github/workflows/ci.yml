name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Generate manifest
        run: node scripts/generate-manifest.js
        env:
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID || 'ci-placeholder-client-id' }}
          EXTENSION_KEY: ${{ vars.EXTENSION_KEY || 'ci-placeholder-extension-key' }}

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
